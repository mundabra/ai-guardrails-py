[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-guardrails-py"
version = "0.1.1"
description = "Lightweight Python guardrails for LLM and agentic apps — prompt injection, PII, secrets, content safety. Zero dependencies."
readme = "README.md"
license = "MIT"
authors = [{ name = "Munish Dabra" }]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/mundabra/ai-guardrails-py"
Repository = "https://github.com/mundabra/ai-guardrails-py"
Sibling = "https://github.com/mundabra/ai-guardrails"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_guardrails"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
